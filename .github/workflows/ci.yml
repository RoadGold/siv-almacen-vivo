name: Pruebas

# Cada push verifica que el sistema sigue en pie antes de tocar un equipo real.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siv
          POSTGRES_PASSWORD: siv
          POSTGRES_DB: siv_almacen_vivo_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ejecutar las pruebas
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://siv:siv@127.0.0.1:5432/siv_almacen_vivo_test
        run: python -m pytest app/tests -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar las pruebas
        working-directory: frontend
        run: npm test

      - name: Comprobar los tipos y compilar
        working-directory: frontend
        run: npm run build
